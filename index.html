<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VISION RUN</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#142440;font:700 14px Arial,sans-serif;text-align:center}#app{max-width:420px;margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;background:#155eef;color:#fff;border-radius:13px;padding:9px 12px}.brand{font-size:17px;letter-spacing:1px}.stats{display:flex;gap:9px;align-items:center;font-size:13px;white-space:nowrap}canvas{display:block;width:100%;height:auto;margin:8px 0 0;border:2px solid #d9e6ff;border-radius:12px;background:#eef5ff;touch-action:none}.row{display:flex;justify-content:space-between;margin:7px 2px 5px;color:#536580;font-size:11px}#gearbag{display:flex;justify-content:center;gap:5px;margin:5px 0 8px}.slot{display:grid;place-items:center;width:28px;height:25px;border:1px solid #d9e6ff;border-radius:7px;background:#f7faff;color:#a4b4cc;font-size:12px}.slot.on{background:#155eef;color:#fff;border-color:#155eef}#progress{height:4px;background:#e9effa;border-radius:4px;margin:0 2px 8px;overflow:hidden}#bar{height:100%;width:0;background:#155eef;transition:width .1s linear}button{border:0;border-radius:11px;background:#155eef;color:#fff;font-weight:800;font-size:15px;padding:12px;width:100%;touch-action:manipulation}#note{font-size:11px;color:#61728d;margin:7px 3px 2px}
</style>
<main id="app">
  <div class="top"><span class="brand">VISION RUN</span><span class="stats"><span id="clock">01:30</span><span id="hearts">♥♥♥</span><span id="score">0</span></span></div>
  <canvas id="c" width="380" height="340" aria-label="Игровое поле VISION RUN"></canvas>
  <div class="row"><span id="stage">УЛИЦА</span><span id="bag">РЮКЗАК 0/8</span></div>
  <div id="gearbag" aria-label="Собранное оборудование"><span class="slot">1</span><span class="slot">2</span><span class="slot">3</span><span class="slot">4</span><span class="slot">5</span><span class="slot">6</span><span class="slot">7</span><span class="slot">8</span></div>
  <div id="progress"><div id="bar"></div></div>
  <button id="go" type="button">НАЧАТЬ ЗАБЕГ</button>
  <div id="note">Нажимай кнопку или на экран, чтобы прыгать. Собери всё оборудование!</div>
</main>
<script>
(()=>{
const c=document.getElementById('c'),x=c.getContext('2d'),go=document.getElementById('go'),clock=document.getElementById('clock'),hearts=document.getElementById('hearts'),scoreEl=document.getElementById('score'),stageEl=document.getElementById('stage'),bagEl=document.getElementById('bag'),bar=document.getElementById('bar'),slots=document.querySelectorAll('.slot');
const W=380,H=340,F=278;let mode=0,t=0,last=0,wall=0,score=0,hp=3,vy=0,jy=0,inv=0,spd=150,obs=[],items=[],coins=[],got=[],hazAt=1,itemAt=2,coinAt=4,zone=0,finalStand=false,won=false;
function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function circ(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}function txt(s,a,b,z,col){x.fillStyle=col;x.font='bold '+z+'px Arial';x.textAlign='center';x.fillText(s,a,b)}function ln(a,b,d,e,col,w){x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function rr(a,b,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function building(bx,w,top,col,seed){let base=F-24;x.fillStyle=col;x.fillRect(bx,top,w,base-top);rect(bx,top,w,7,'#fff3dd');rect(bx,top+7,w,4,'#b7a48c');rect(bx,base-13,w,13,'#c7b9a7');rect(bx+3,top+14,w-6,5,'#d8c5a8');for(let k=0;k<5;k++){let px=bx+k*w/4;rect(px,top+15,3,base-top-28,'rgba(255,255,255,.42)');rect(px+4,top+15,1,base-top-28,'rgba(104,86,69,.16)')}let cols=Math.max(2,Math.floor(w/31));for(let row=0,wy=top+34;wy<base-32;row++,wy+=42){for(let j=0;j<cols;j++){let wx=bx+11+j*(w-22)/cols,ww=Math.min(16,(w-22)/cols-4),wh=row===0?22:19;rect(wx-2,wy-3,ww+4,wh+6,'#f5e8d3');rr(wx,wy,ww,wh,4,seed%2?'#829bab':'#8faeb8');rect(wx+2,wy+3,ww-4,2,'#dcebf0');rect(wx+ww/2,wy,1,wh,'rgba(255,255,255,.7)');rect(wx-3,wy+wh+3,ww+6,3,'#ae9b83')}}rect(bx+2,base-31,w-4,5,'#b19d83');rect(bx,base-26,w,4,'#f4e8d4');for(let j=0;j<cols;j++){let wx=bx+12+j*(w-24)/cols;rect(wx,base-22,Math.min(19,(w-25)/cols),22,'#758b95');rect(wx+3,base-19,Math.min(13,(w-32)/cols),15,'#b9d0d4')}x.fillStyle='#e5d4bb';x.beginPath();x.moveTo(bx+w*.32,top);x.lineTo(bx+w*.5,top-15);x.lineTo(bx+w*.68,top);x.closePath();x.fill();rect(bx+w*.47,top-17,w*.06,4,'#9c8060')}
function singerHouse(sx){let by=151;rect(sx-35,by,70,94,'#d8c8a9');rect(sx-31,by+8,62,3,'#fff1d9');for(let i=0;i<3;i++){let xx=sx-24+i*18;rect(xx,by+17,11,17,'#849eaa');rect(xx-2,by+15,15,3,'#f3e4cc');rect(xx,by+48,11,18,'#849eaa');rect(xx-2,by+46,15,3,'#f3e4cc')}x.fillStyle='rgba(83,155,178,.9)';x.beginPath();x.moveTo(sx-27,by+5);x.quadraticCurveTo(sx-25,by-38,sx,by-45);x.quadraticCurveTo(sx+25,by-38,sx+27,by+5);x.closePath();x.fill();x.strokeStyle='#e4f5f6';x.lineWidth=2;x.stroke();ln(sx,by-44,sx,by-64,'#806e58',2);circ(sx,by-68,5,'#e7b64b');circ(sx-10,by-25,5,'#d8f0ee')}
function lamp(lx){ln(lx,F-24,lx,F-118,'#29364a',4);ln(lx-12,F-116,lx+8,F-116,'#29364a',3);ln(lx+8,F-116,lx+12,F-106,'#29364a',2);rr(lx+5,F-108,15,18,5,'#f2d58d');rect(lx+8,F-105,9,3,'#fff3c6');circ(lx+12,F-99,2,'#fff8dc')}
function back(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#d7e8f5');sky.addColorStop(.7,'#eff5f8');sky.addColorStop(1,'#f8f4ec');x.fillStyle=sky;x.fillRect(0,0,W,H);circ(42,54,17,'rgba(255,255,255,.7)');circ(64,52,21,'rgba(255,255,255,.75)');circ(86,56,15,'rgba(255,255,255,.68)');let p=t*spd*.045%150,colors=['#e7d9c3','#d8c8b0','#ead6c0','#d7d9d0','#e9d5ba'];for(let i=0;i<5;i++)building(i*150-p-30,158,65+(i%3)*10,colors[(i+1)%colors.length],i);let sx=302-t*spd*.055;if(sx>-55&&sx<430)singerHouse(sx);if(zone===1){for(let i=0;i<4;i++){let tx=(i*128-p*.7%128);rect(tx+20,211,5,31,'#746451');circ(tx+22,201,20,'#89ae91');circ(tx+10,207,12,'#9fc4a0');circ(tx+34,207,12,'#9fc4a0')}}rect(0,F-24,W,H-F+24,'#c6cbd0');rect(0,F-27,W,5,'#8d979f');rect(0,F,W,H-F,'#555c64');for(let i=0;i<9;i++){let dx=(i*57-(t*spd*.7%57));rect(dx,F+34,29,3,'rgba(255,255,255,.62)');rect(dx+8,F+58,13,2,'rgba(255,255,255,.25)')}for(let i=0;i<3;i++)lamp((i*178-(t*spd*.25%178))+105);if(t<23){rr(8,83,105,20,4,'#f6f1e8');x.strokeStyle='#45677d';x.lineWidth=1;x.strokeRect(8,83,105,20);txt('\u041D\u0415\u0412\u0421\u041A\u0418\u0419 \u041F\u0420\u041E\u0421\u041F\u0415\u041A\u0422',60,97,8,'#34536b')}if(zone===2){let d=286-Math.min(135,(t-60)*4.5);rect(d,176,77,102,'#fff');rect(d+7,184,63,20,'#155eef');txt('VISION',d+38,199,10,'#fff');rect(d+15,213,46,65,'#e8f0ff');circ(d+54,248,3,'#155eef');rect(d+5,276,66,3,'#155eef')}}
function shoe(sx,sy){rr(sx,sy,22,9,4,'#fff');rr(sx+1,sy+7,22,3,2,'#dce4eb');x.strokeStyle='#8e9aa4';x.lineWidth=1;for(let i=0;i<3;i++)ln(sx+7+i*3,sy+2,sx+11+i*3,sy+5,'#9aa6af',1);x.beginPath();x.moveTo(sx+3,sy+5);x.quadraticCurveTo(sx+9,sy+8,sx+16,sy+4);x.stroke()}
function player(){let base=F+jy,step=Math.sin(t*13),bob=Math.sin(t*13)*1.3;x.save();if(inv>0&&Math.floor(t*14)%2)x.globalAlpha=.48;circ(96,F-1,20,'rgba(31,45,59,.15)');rr(73,base-43,15,25,5,'#10294d');rr(76,base-40,10,19,4,'#1769d5');rect(77,base-39,8,2,'#65aeff');x.fillStyle='#263249';x.strokeStyle='#172237';x.lineWidth=1.3;x.beginPath();x.moveTo(84,base-27);x.lineTo(98,base-28);x.lineTo(100+step*3,base-7);x.lineTo(86+step*3,base-7);x.closePath();x.fill();x.stroke();x.beginPath();x.moveTo(98,base-28);x.lineTo(111,base-27);x.lineTo(106-step*3,base-7);x.lineTo(94-step*3,base-7);x.closePath();x.fill();x.stroke();ln(88,base-12,98+step*2,base-12,'#566176',2);ln(100,base-17,107-step*2,base-17,'#566176',2);shoe(79+step*3,base-8);shoe(99-step*3,base-8);x.fillStyle='#155eef';x.strokeStyle='#1049ae';x.lineWidth=1.5;x.beginPath();x.moveTo(84,base-47+bob);x.quadraticCurveTo(95,base-53+bob,108,base-46+bob);x.lineTo(108,base-25);x.quadraticCurveTo(96,base-21,84,base-26);x.closePath();x.fill();x.stroke();rr(82,base-45+bob,7,18,3,'#0f4cb4');x.strokeStyle='#0f4cb4';x.lineWidth=5;x.lineCap='round';x.beginPath();x.moveTo(86,base-42+bob);x.lineTo(79+step*3,base-30);x.stroke();x.beginPath();x.moveTo(106,base-42+bob);x.lineTo(115-step*3,base-31);x.stroke();circ(79+step*3,base-29,3,'#e7aa83');circ(115-step*3,base-30,3,'#e7aa83');x.lineCap='butt';x.strokeStyle='#e7b955';x.lineWidth=2;x.beginPath();x.moveTo(90,base-32);x.quadraticCurveTo(96,base-25,102,base-32);x.stroke();circ(97,base-30,2,'#f3cf71');circ(97,base-53+bob,10,'#d99b72');circ(106,base-53+bob,2,'#d99b72');circ(100,base-54+bob,1.3,'#142440');ln(101,base-57+bob,105,base-58+bob,'#142440',1.5);x.fillStyle='#173458';x.beginPath();x.moveTo(88,base-58+bob);x.quadraticCurveTo(89,base-69+bob,101,base-67+bob);x.quadraticCurveTo(108,base-66+bob,109,base-59+bob);x.lineTo(89,base-58+bob);x.closePath();x.fill();x.fillStyle='#155eef';x.beginPath();x.moveTo(89,base-61+bob);x.quadraticCurveTo(99,base-69+bob,109,base-61+bob);x.lineTo(108,base-58+bob);x.lineTo(89,base-58+bob);x.closePath();x.fill();rr(105,base-61+bob,15,3,2,'#155eef');txt('V',99,base-61+bob,6,'#fff');x.restore()}function hazard(o){let y=F-o.h;if(o.k===0){circ(o.x+12,F-2,11,'#9fc5ff');circ(o.x+30,F-2,8,'#9fc5ff');rect(o.x+8,y+8,25,4,'#74a7ff')}else if(o.k===1){x.fillStyle='#f1ad3b';x.beginPath();x.moveTo(o.x+o.w/2,y);x.lineTo(o.x+o.w,y+o.h);x.lineTo(o.x,y+o.h);x.fill();rect(o.x+7,y+17,o.w-14,4,'#fff');rect(o.x+2,F-5,o.w+4,5,'#e39725')}else if(o.k===2){rect(o.x,y,o.w,o.h,'#62748e');rect(o.x+4,y+5,o.w-8,5,'#445874');circ(o.x+8,y+o.h,3,'#152440');circ(o.x+o.w-8,y+o.h,3,'#152440')}else if(o.k===3){ln(o.x,F-2,o.x+o.w,F-2,'#152440',5);circ(o.x+8,F-1,5,'#155eef');circ(o.x+o.w-8,F-1,5,'#155eef')}else{ln(o.x+14,F-4,o.x+14,F-32,'#152440',3);ln(o.x+4,F-32,o.x+24,F-32,'#155eef',4);ln(o.x+14,F-24,o.x+3,F-12,'#152440',2);ln(o.x+14,F-24,o.x+25,F-12,'#152440',2)}}
function gear(q){circ(q.x,q.y,18,'#fff');x.strokeStyle='#155eef';x.lineWidth=2.5;x.beginPath();x.arc(q.x,q.y,16,0,Math.PI*2);x.stroke();let a=q.x,b=q.y;x.strokeStyle='#155eef';x.fillStyle='#155eef';if(q.id===0){x.beginPath();x.arc(a,b,8,3.2,6.2);x.stroke();rect(a-10,b-2,4,9,'#155eef');rect(a+6,b-2,4,9,'#155eef')}else if(q.id===1){circ(a,b-5,4,'#155eef');rect(a-2,b-2,4,11,'#155eef');circ(a,b+10,2,'#155eef')}else if(q.id===2){rect(a-10,b-7,20,14,'#155eef');circ(a-5,b,2,'#fff');circ(a+2,b,2,'#fff');circ(a+7,b,2,'#fff')}else if(q.id===3){rect(a-9,b-7,18,12,'#155eef');ln(a-12,b+7,a+12,b+7,'#155eef',2)}else if(q.id===4){circ(a,b-4,7,'#155eef');ln(a,b+3,a,b+12,'#155eef',2)}else if(q.id===5){x.beginPath();x.arc(a-2,b,8,-1,4);x.stroke();ln(a-9,b+6,a+5,b+10,'#155eef',2)}else if(q.id===6){rect(a-8,b-5,16,11,'#155eef');rect(a-3,b-9,6,4,'#155eef');rect(a-4,b-2,3,3,'#fff');rect(a+2,b-2,3,3,'#fff')}else{circ(a-6,b-4,5,'#155eef');ln(a-2,b,a+10,b+9,'#155eef',3);ln(a+4,b+5,a+7,b+2,'#155eef',2);ln(a+8,b+8,a+11,b+5,'#155eef',2)}}
function coin(q){circ(q.x,q.y,10,'#155eef');circ(q.x,q.y,7,'#fff');txt('V',q.x,q.y+4,9,'#155eef')}
function card(title,line1,line2){rect(24,82,332,152,'#fff');x.strokeStyle='#155eef';x.lineWidth=2;x.strokeRect(24,82,332,152);rect(24,82,332,7,'#155eef');txt(title,190,124,19,'#155eef');txt(line1,190,154,13,'#142440');txt(line2,190,195,20,'#155eef')}
function draw(){back();coins.forEach(coin);items.forEach(gear);obs.forEach(hazard);player();if(mode===0)card('БЕГ К VISION','Собери оборудование и жетоны','Тапни — прыгай');if(mode===2)card('ЗАБЕГ ОКОНЧЕН',score+' очков • '+got.length+'/8 предметов','ПРОМОКОД: VISION5 • 5%');if(mode===3)card(won?'ФИНИШ!':'ЗАБЕГ ОКОНЧЕН',score+' очков • '+got.length+'/8 предметов','ПРОМОКОД: VISION'+(won&&got.length===8?'12':'8')+' • '+(won&&got.length===8?'12%':'8%'))}
function hud(){let left=Math.max(0,90-Math.floor(t));clock.textContent=(left>=60?'01:':'00:')+('0'+(left%60)).slice(-2);hearts.textContent='♥'.repeat(Math.max(0,hp))+'♡'.repeat(Math.max(0,3-hp));scoreEl.textContent=score;bagEl.textContent='РЮКЗАК '+got.length+'/8';slots.forEach((s,i)=>s.classList.toggle('on',got.includes(i)));stageEl.textContent=t<30?'УЛИЦА':t<60?'ДВОР':'К VISION';bar.style.width=Math.min(100,t/90*100)+'%';spd=t<30?150:t<60?180:215;zone=t<30?0:t<60?1:2}
function finish(win){mode=win?3:2;won=win;go.textContent='СЫГРАТЬ ЕЩЁ';draw()}
function frame(ts){if(mode!==1)return;let d=Math.min(.04,(ts-last)/1000||0);last=ts;t+=d;hud();if(t>=90||Date.now()-wall>=120000){finish(true);return}jy+=vy*d;vy+=950*d;if(jy>0){jy=0;vy=0}let py=F-52+jy;if(inv>0)inv-=d;hazAt-=d;itemAt-=d;coinAt-=d;if(hazAt<=0){if(t>=86&&!finalStand){obs.push({x:W+10,w:28,h:34,k:4,hit:false});finalStand=true;hazAt=100}else{let k=Math.floor(Math.random()*4),h=[12,25,34,8][k];obs.push({x:W+10,w:k===2?34:28,h,k,hit:false});hazAt=Math.max(1.35,2.35-t*.008)*(0.8+Math.random()*.4)}}if(itemAt<=0&&got.length<8&&!items.some(q=>q.id===got.length)){items.push({x:W+10,y:F-85-Math.random()*46,id:got.length});itemAt=7.4+Math.random()*1.8}if(coinAt<=0){coins.push({x:W+10,y:F-43});coinAt=5.5+Math.random()*3.5}obs.forEach(o=>{o.x-=spd*d;if(!o.hit&&o.x<117&&o.x+o.w>70&&py+48>F-o.h&&inv<=0){hp--;inv=1.1;o.hit=true;if(hp<=0)finish(false)}});if(mode!==1)return;items.forEach(q=>{q.x-=spd*d;if(q.x<115&&q.x>65){if(!got.includes(q.id)){got.push(q.id);score+=100}q.x=-30}});coins.forEach(q=>{q.x-=spd*d;if(q.x<115&&q.x>65){score+=25;q.x=-30}});obs=obs.filter(q=>q.x>-50);items=items.filter(q=>q.x>-30);coins=coins.filter(q=>q.x>-20);draw();requestAnimationFrame(frame)}
function reset(){t=0;score=0;hp=3;got=[];obs=[];items=[];coins=[];spd=150;zone=0;finalStand=false;won=false;vy=0;jy=0;inv=0;hazAt=1;itemAt=2;coinAt=4;hud();draw()}
function act(){if(mode===0){mode=1;wall=Date.now();last=performance.now();hazAt=1;requestAnimationFrame(frame)}else if(mode===1){if(jy===0)vy=-410}else{reset();mode=0}go.textContent=mode===1?'ПРЫЖОК':mode===0?'НАЧАТЬ ЗАБЕГ':'СЫГРАТЬ ЕЩЁ'}
go.addEventListener('click',act);c.addEventListener('pointerdown',e=>{e.preventDefault();if(mode===1)act()});draw();hud()
})();
</script>
</html>
