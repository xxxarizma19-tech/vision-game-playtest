function hud(){let left=Math.max(0,90-Math.floor(t));clock.textContent=(left>=60?'01:':'00:')+('0'+(left%60)).slice(-2);hearts.textContent='♥'.repeat(Math.max(0,hp))+'♡'.repeat(Math.max(0,3-hp));scoreEl.textContent=score;bagEl.textContent='РЮКЗАК '+got.length+'/8';slots.forEach((s,i)=>s.classList.toggle('on',got.includes(i)));stageEl.textContent=t<30?'НЕВСКИЙ ПРОСПЕКТ':t<60?'ДВОР':'УЛИЦА НЕКРАСОВА · VISION';duckBtn.style.display=t>=30?'block':'none';bar.style.width=Math.min(100,t/90*100)+'%';spd=150+Math.min(90,t)*.72;zone=t<30?0:t<60?1:2}
